services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beliga}
      POSTGRES_USER: ${POSTGRES_USER:-beliga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    expose:
      - "5432"
    volumes:
      - beliga-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beliga} -d ${POSTGRES_DB:-beliga}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: liga-app:latest  # Note: No 'build' block here, uses the last built image
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-beliga}
      DB_USERNAME: ${POSTGRES_USER:-beliga}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  beliga-db-data:
    external: true