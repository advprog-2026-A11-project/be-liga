spring.application.name=liga

# Tell Spring Boot to read .env.local automatically
spring.config.import=optional:file:.env.local[.properties]

# Database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Auth configuration (Un-hardcoded!)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_SUPABASE_URL}/auth/v1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

logging.level.org.hibernate.SQL=DEBUG

# Explicitly set server port so it doesn't clash with be-auth
server.port=${SERVER_PORT:8080}

# Frontend URL for CORS (Falls back to localhost:3000 if FRONTEND_URL is not set)
frontend.url=${FRONTEND_URL:http://localhost:3000}